      <path d="M32 0H0V32" fill="none" stroke="#22282d" stroke-opacity=".055" />
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f7f4ed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#22282d" flood-opacity=".12" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="626" fill="none" stroke="#22282d" stroke-opacity=".16" stroke-width="2" />

