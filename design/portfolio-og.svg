      <path d="M10 42h38c7.2 0 13-5.8 13-13 0-6.7-5-12.2-11.6-12.9C46.8 10.2 39.4 5 31 5c-8.5 0-15.8 5.2-18.6 12.6C5.5 18.3 0 23.4 0 30c0 6.6 4.5 12 10 12Z" fill="none" stroke="#5d858e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="82" y="38" fill="#5d858e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="900" letter-spacing="2">CLOUD</text>
