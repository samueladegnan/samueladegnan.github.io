<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Sam Degnan, secure systems engineer</title>
  <desc id="description">Sam Degnan's portfolio of privacy engineering, cloud infrastructure, and reliable developer delivery.</desc>
  <defs>
