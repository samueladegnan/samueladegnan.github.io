<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Sam Degnan software engineer portfolio</title>
  <desc id="description">Secure systems across privacy engineering, multi-cloud infrastructure, and developer tooling.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22282d" stroke-opacity=".055" />
    </pattern>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f7f4ed" />
    </linearGradient>
    <linearGradient id="coralFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e26d52" stop-opacity=".95" />
      <stop offset="1" stop-color="#b84d38" stop-opacity=".8" />
    </linearGradient>
    <linearGradient id="blueFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8db5bd" />
      <stop offset="1" stop-color="#5d858e" />
    </linearGradient>
    <linearGradient id="greenFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91b184" />
      <stop offset="1" stop-color="#5d7d53" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#22282d" flood-opacity=".1" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paperGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <path d="M0 0H1200V630H0Z" fill="none" stroke="#22282d" stroke-opacity=".14" stroke-width="2" />

  <g transform="translate(64 58)">
    <circle cx="7" cy="7" r="7" fill="#668460" />
    <text x="28" y="13" fill="#b84d38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.2">SAM DEGNAN / SOFTWARE ENGINEER</text>
  </g>

  <path d="M64 116H646" stroke="#22282d" stroke-opacity=".16" />
  <path d="M676 58V572" stroke="#22282d" stroke-opacity=".16" stroke-dasharray="2 12" />

  <g transform="translate(64 154)">
    <text fill="#22282d" font-family="Georgia, Times New Roman, serif" font-size="88" letter-spacing="-5">Secure</text>
    <text y="89" fill="#22282d" font-family="Georgia, Times New Roman, serif" font-size="88" letter-spacing="-5">systems</text>
    <text y="178" fill="#b84d38" font-family="Georgia, Times New Roman, serif" font-size="88" font-style="italic" letter-spacing="-5">with boundaries.</text>
    <text y="246" fill="#58626a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.5">CRYPTOGRAPHY · CLOUD · TOOLING</text>
    <path d="M0 284H470" stroke="#22282d" stroke-opacity=".16" />
    <text y="325" fill="#58626a" font-family="Inter, Arial, sans-serif" font-size="19">Privacy engineering, multi-cloud infrastructure,</text>
    <text y="354" fill="#58626a" font-family="Inter, Arial, sans-serif" font-size="19">and reliable developer delivery.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="726" y="90" width="408" height="132" rx="14" fill="#fffdf8" stroke="#e26d52" stroke-width="2" />
    <rect x="726" y="90" width="8" height="132" rx="4" fill="url(#coralFade)" />
    <text x="760" y="126" fill="#b84d38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.8">01 / PRIVACY ENGINEERING</text>
    <text x="760" y="164" fill="#22282d" font-family="Georgia, Times New Roman, serif" font-size="27">Zero-knowledge proofs</text>
    <text x="760" y="192" fill="#626b70" font-family="Inter, Arial, sans-serif" font-size="15">Client-owned data · post-quantum cryptography</text>
    <g transform="translate(1045 154)" fill="none" stroke="#e26d52" stroke-width="2">
      <circle r="31" opacity=".2" />
      <circle r="20" opacity=".5" />
      <circle r="8" fill="#e26d52" stroke="none" />
      <path d="M-31 0H-20M20 0H31M0-31V-20M0 20V31" opacity=".7" />
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="726" y="249" width="408" height="132" rx="14" fill="#fffdf8" stroke="#5d858e" stroke-width="2" />
    <rect x="726" y="249" width="8" height="132" rx="4" fill="url(#blueFade)" />
    <text x="760" y="285" fill="#5d858e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.8">02 / MULTI-CLOUD OPERATIONS</text>
    <text x="760" y="323" fill="#22282d" font-family="Georgia, Times New Roman, serif" font-size="27">Cloud control planes</text>
    <text x="760" y="351" fill="#626b70" font-family="Inter, Arial, sans-serif" font-size="15">Short-lived environments · policy as code</text>
    <g transform="translate(1040 314)" fill="none" stroke="#5d858e" stroke-width="2">
      <path d="M-35 14 0-17 35 14M-35 14 0 43 35 14" opacity=".5" />
      <path d="M0-17V43M-35 14H35" opacity=".28" />
      <circle cx="0" cy="-17" r="6" fill="#5d858e" stroke="none" />
      <circle cx="-35" cy="14" r="6" fill="#5d858e" stroke="none" />
      <circle cx="35" cy="14" r="6" fill="#5d858e" stroke="none" />
      <circle cx="0" cy="43" r="6" fill="#5d858e" stroke="none" />
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="726" y="408" width="408" height="132" rx="14" fill="#fffdf8" stroke="#5d7d53" stroke-width="2" />
    <rect x="726" y="408" width="8" height="132" rx="4" fill="url(#greenFade)" />
    <text x="760" y="444" fill="#5d7d53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.8">03 / DEVELOPER TOOLING</text>
    <text x="760" y="482" fill="#22282d" font-family="Georgia, Times New Roman, serif" font-size="27">Reviewable CI security</text>
    <text x="760" y="510" fill="#626b70" font-family="Inter, Arial, sans-serif" font-size="15">SARIF findings · OPA gates · deterministic checks</text>
    <g transform="translate(1032 474)" fill="none" stroke="#5d7d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-37 0H-17L-5-17 10 17 20 0H39" />
      <circle cx="-37" cy="0" r="5" fill="#5d7d53" stroke="none" />
      <circle cx="39" cy="0" r="5" fill="#5d7d53" stroke="none" />
    </g>
  </g>

  <g transform="translate(64 566)">
    <text fill="#22282d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.6">PRIVACY BOUNDARIES</text>
    <circle cx="178" cy="-4" r="3" fill="#e26d52" />
    <text x="198" fill="#22282d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.6">CLOUD LIFECYCLE</text>
    <circle cx="364" cy="-4" r="3" fill="#5d858e" />
    <text x="384" fill="#22282d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.6">RELIABLE DELIVERY</text>
    <circle cx="579" cy="-4" r="3" fill="#5d7d53" />
  </g>
</svg>
